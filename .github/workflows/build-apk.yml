name: Crear APK Diaz Music

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip "$ZIP" -d proyecto

      - name: Compilar aplicación
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Diaz-Music-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
