name: Crear APK de Diaz Music

on:
  "on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          ARCHIVO=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ARCHIVO" -d proyecto
          CARPETA=$(find proyecto -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROYECTO=$CARPETA" >> "$GITHUB_ENV"

      - name: Compilar aplicación
        run: |
          cd "$PROYECTO"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Diaz-Music-APK
          path: "**/build/outputs/apk/debug/*.apk"
